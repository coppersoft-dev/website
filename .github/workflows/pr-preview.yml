name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN || 'website-preview.coppersoft.dev' }}
  INGRESS_CLASS: ${{ vars.PREVIEW_INGRESS_CLASS || 'nginx' }}

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push preview image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}-${{ github.sha }}

      - name: Checkout repo for previews branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: gitops
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out (or create) previews branch
        working-directory: gitops
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet refs/remotes/origin/previews; then
            git checkout -B previews origin/previews
          else
            git checkout --orphan previews
            git rm -rf . > /dev/null
          fi

      - name: Render preview manifest
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IMAGE: ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "gitops/deploy/previews/pr-${PR_NUMBER}"
          for template in deploy/previews/templates/*.yaml; do
            envsubst < "$template" > "gitops/deploy/previews/pr-${PR_NUMBER}/$(basename "$template")"
          done

      - name: Sync static namespace manifest
        run: cp deploy/previews/namespace.yaml gitops/deploy/previews/namespace.yaml

      - name: Regenerate previews index
        run: |
          set -euo pipefail
          cd gitops/deploy/previews
          shopt -s nullglob
          {
            echo "apiVersion: kustomize.config.k8s.io/v1beta1"
            echo "kind: Kustomization"
            echo "resources:"
            echo "  - namespace.yaml"
            for dir in pr-*/; do
              echo "  - ${dir%/}"
            done
          } > kustomization.yaml

      - name: Commit and push preview manifest
        working-directory: gitops
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "deploy/previews/pr-${PR_NUMBER}" deploy/previews/namespace.yaml deploy/previews/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy PR #${PR_NUMBER} preview (${GITHUB_SHA})"
            git push
          fi

      - name: Wait for preview to serve this revision
        env:
          PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.${{ env.PREVIEW_DOMAIN }}
          EXPECTED_SHA: ${{ github.sha }}
          TIMEOUT_SECONDS: "900"
        run: |
          set -uo pipefail
          deadline=$((SECONDS + TIMEOUT_SECONDS))
          while true; do
            # Cache-buster + no-cache so we never read a stale cached response
            served=$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' \
              "${PREVIEW_URL}/version.txt?t=$(date +%s)" 2>/dev/null | tr -d '[:space:]') || served=""
            if [ "$served" = "$EXPECTED_SHA" ]; then
              if curl -fsS --max-time 10 -o /dev/null "${PREVIEW_URL}/"; then
                echo "Preview at ${PREVIEW_URL} is serving ${EXPECTED_SHA}"
                break
              fi
              echo "Revision matches but index page is not reachable yet"
            else
              echo "Preview not ready (served: '${served:-<unreachable>}', expected: ${EXPECTED_SHA})"
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Timed out after ${TIMEOUT_SECONDS}s waiting for ${PREVIEW_URL} to serve ${EXPECTED_SHA}"
              exit 1
            fi
            sleep 10
          done

      - name: Comment preview URL on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.${{ env.PREVIEW_DOMAIN }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const marker = '<!-- pr-preview-comment -->';
            const body = `${marker}\n🚀 Preview ready: ${process.env.PREVIEW_URL}\n\nVerified: the preview is serving commit ${process.env.COMMIT_SHA}.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete PR image from GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          ids=$(gh api "orgs/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}/versions" \
            --paginate \
            --jq ".[] | select(.metadata.container.tags[]? | startswith(\"pr-${PR_NUMBER}-\")) | .id")
          if [ -z "$ids" ]; then
            echo "No image versions found for PR #${PR_NUMBER}"
          fi
          for id in $ids; do
            echo "Deleting ghcr.io/${{ github.repository }} version $id"
            gh api --method DELETE "orgs/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}/versions/$id"
          done

      - name: Check out previews branch if it exists
        id: previews_branch
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet refs/remotes/origin/previews; then
            git checkout -B previews origin/previews
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove preview manifest
        if: steps.previews_branch.outputs.exists == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch "deploy/previews/pr-${PR_NUMBER}"

          cd deploy/previews
          shopt -s nullglob
          {
            echo "apiVersion: kustomize.config.k8s.io/v1beta1"
            echo "kind: Kustomization"
            echo "resources:"
            echo "  - namespace.yaml"
            for dir in pr-*/; do
              echo "  - ${dir%/}"
            done
          } > kustomization.yaml
          cd ../..

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/previews/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Nothing to remove"
          else
            git commit -m "Remove PR #${PR_NUMBER} preview"
            git push
          fi

      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- pr-preview-comment -->';
            const body = `${marker}\n🧹 Preview for this PR has been torn down.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
