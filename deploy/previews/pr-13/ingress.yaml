apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: website-pr-13
  labels:
    app.kubernetes.io/name: website-preview
    app.kubernetes.io/instance: pr-13
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: nginx-public
  rules:
  - host: pr-13.website-preview.coppersoft.dev
    http:
      paths:
      - backend:
          service:
            name: website-pr-13
            port:
              name: http
        path: /
        pathType: Prefix
  tls:
    - hosts:
      - pr-13.website-preview.coppersoft.dev
      secretName: pr-13-website-preview.coppersoft.dev-tls
