<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0E1419">
  <title>Stay on the Line — Coppersoft</title>
  <meta name="description" content="A steady-hand wire loop challenge from Coppersoft.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../main.css">
  <link rel="stylesheet" href="wire-loop.css">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="manifest" href="/images/site.webmanifest">
</head>
<body class="game-page">
  <main class="game-main">
    <section class="game-hero" aria-labelledby="game-title">
      <div class="game-glow game-glow-left" aria-hidden="true"></div>
      <div class="game-glow game-glow-right" aria-hidden="true"></div>

      <div class="wrap game-wrap">
        <div class="game-intro">
          <h1 id="game-title" data-de="Bleib auf <span class=&quot;c&quot;>Kurs.</span>" data-en="Stay on <span class=&quot;c&quot;>the line.</span>"></h1>
          <p class="game-lead" data-de="Ruhige Hand. Klarer Kopf. Führe den Ring vom Start bis ins Ziel – immer entlang der Kupferleitung." data-en="Steady hands. Clear minds. Guide the contact from start to finish without leaving the copper line."></p>
          <p class="advent-note" data-de="Jeden Tag eine neue Strecke · 1.–24. Dez." data-en="New daily route · Dec 1–24"></p>
        </div>

        <div class="game-panel" id="game-panel">
          <div class="game-toolbar" aria-live="polite">
            <div class="game-state">
              <span class="state-dot" aria-hidden="true"></span>
              <span id="state-label" data-de="Bereit" data-en="Ready"></span>
            </div>
            <div class="game-metrics">
              <div class="game-day" id="game-day-chooser">
                <button class="game-day-trigger" id="game-day-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                  <span id="game-day-label" data-de="Tag wählen" data-en="Choose day"></span>
                  <strong id="game-day-value">01 / 24</strong>
                  <span class="game-day-chevron" aria-hidden="true"></span>
                </button>
              </div>
              <span><span data-de="Zeit" data-en="Time"></span> <strong id="game-time">0.0 seconds</strong></span>
              <span><span data-de="Bestzeit" data-en="Best"></span> <strong id="game-best">— seconds</strong></span>
            </div>
          </div>

          <div class="game-viewport">
            <div class="celebration" id="celebration" aria-hidden="true"></div>
            <div class="game-day-menu" id="game-day-menu" hidden>
              <div class="game-day-grid" id="game-day-grid" role="listbox" aria-labelledby="game-day-label"></div>
              <div class="door-tooltip" id="door-tooltip" role="status" hidden></div>
            </div>
            <div class="track-stage" id="track-stage" aria-describedby="game-hint">
              <svg class="track" id="wire-game" viewBox="0 0 1000 350" role="img" aria-label="Copper wire loop game" aria-describedby="track-desc">
              <desc id="track-desc">Move from the start node on the left along the copper wire to the finish node on the right without leaving the line.</desc>
              <defs>
                <linearGradient id="copper-gradient" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#8f4f25"/>
                  <stop offset=".32" stop-color="#f1ac72"/>
                  <stop offset=".6" stop-color="#b87333"/>
                  <stop offset="1" stop-color="#e49a5e"/>
                </linearGradient>
                <filter id="wire-glow" x="-20%" y="-40%" width="140%" height="180%">
                  <feGaussianBlur stdDeviation="5" result="blur"/>
                  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
              </defs>

              <path class="wire-shadow" id="wire-shadow" d="M74 190 H174 C205 190 219 207 219 234 V263 C219 291 235 305 262 305 H303 C332 305 346 289 346 261 V170 C346 131 369 111 407 111 H439 C474 111 490 130 490 163 V278 C490 311 508 329 534 329 C559 329 575 311 575 280 V241 C575 213 592 196 616 196 C638 196 648 210 660 232 C671 251 683 260 708 260 H733 C758 260 770 245 770 219 V100 C770 63 793 43 830 43 H858 C897 43 915 65 915 102 V202 C915 231 931 247 959 247 H984"/>
              <path class="wire-active-glow" id="wire-active-glow" aria-hidden="true"/>
              <path class="wire" id="wire-path" d="M74 190 H174 C205 190 219 207 219 234 V263 C219 291 235 305 262 305 H303 C332 305 346 289 346 261 V170 C346 131 369 111 407 111 H439 C474 111 490 130 490 163 V278 C490 311 508 329 534 329 C559 329 575 311 575 280 V241 C575 213 592 196 616 196 C638 196 648 210 660 232 C671 251 683 260 708 260 H733 C758 260 770 245 770 219 V100 C770 63 793 43 830 43 H858 C897 43 915 65 915 102 V202 C915 231 931 247 959 247 H984"/>
              <g class="fog-cloud" id="fog-cloud" aria-hidden="true">
                <ellipse class="fog-haze" rx="126" ry="61"/>
                <path class="fog-body" d="M-100 9 C-113 -5 -97 -26 -78 -26 C-67 -47 -38 -49 -20 -38 C-4 -58 27 -53 40 -35 C63 -42 88 -29 90 -12 C113 -9 112 17 96 25 C80 38 58 35 43 31 C24 43 -2 40 -18 33 C-38 42 -63 36 -73 27 C-91 30 -103 23 -100 9 Z"/>
                <ellipse class="fog-wisp" cx="-60" cy="-17" rx="38" ry="15"/>
                <ellipse class="fog-wisp" cx="20" cy="-25" rx="54" ry="16"/>
                <ellipse class="fog-wisp" cx="58" cy="13" rx="47" ry="15"/>
                <ellipse class="fog-wisp" cx="-32" cy="18" rx="58" ry="14"/>
              </g>

              <g class="node start-node" transform="translate(74 190)">
                <circle class="node-halo" r="28"/>
                <circle class="node-ring" r="14"/>
                <circle class="node-core" r="5"/>
              </g>
              <g class="node finish-node" transform="translate(984 247)">
                <circle class="node-halo" r="30"/>
                <circle class="node-ring" r="16"/>
                <path class="finish-mark" d="M-7 0 -2 5 8 -7"/>
              </g>

              <text class="track-label" x="48" y="237" data-svg-de="START" data-svg-en="START">START</text>
              <text class="track-label track-label-end" x="986" y="294" text-anchor="end" data-svg-de="ZIEL" data-svg-en="FINISH">FINISH</text>

              <g class="spark" id="spark" aria-hidden="true" visibility="hidden">
                <g id="spark-flicker">
                  <path class="spark-rays spark-rays-a" d="M-2 -3 L-7 -27 M3 -2 L18 -21 M4 1 L29 -4 M2 4 L14 25 M-3 3 L-19 19 M-4 0 L-29 -8"/>
                  <path class="spark-rays spark-rays-b" d="M-3 -2 L-22 -17 M1 -4 L3 -32 M4 -1 L24 -14 M4 3 L23 15 M0 4 L-5 27 M-4 2 L-27 5"/>
                  <circle class="spark-glow" r="5"/>
                  <circle class="spark-core" r="2"/>
                </g>
              </g>
              <g class="wand" id="wand" transform="translate(74 190)" aria-hidden="true">
                <circle class="wand-outer" r="20"/>
                <circle class="wand-inner" r="10"/>
                <path class="wand-handle" d="M14 14 L30 30"/>
                <circle class="wand-grip" cx="32.5" cy="32.5" r="4.5"/>
              </g>
              </svg>
            </div>

            <div class="game-overlay" id="game-overlay">
              <div class="overlay-card">
                <div class="overlay-icon" id="overlay-icon" aria-hidden="true">↗</div>
                <h2 id="overlay-title" data-de="Bist du bereit?" data-en="Ready for the route?"></h2>
                <p id="overlay-copy" data-de="Drücke auf „Start“ und führe den Ring entlang der Kupferleitung. Mit Maus oder Finger – Hauptsache ruhig." data-en="Press start, then move the ring along the line. Mouse or finger — steady does it."></p>
                <button class="game-button" id="start-game" type="button">
                  <span data-de="Start" data-en="Start"></span>
                </button>
              </div>
            </div>
          </div>

          <p class="game-hint" id="game-hint" data-de="Klicke oder tippe auf den linken Startpunkt und folge der Kupferleitung." data-en="Click or tap the left contact point, then follow the wire."></p>
        </div>
      </div>
    </section>

    <section class="game-values" aria-label="Coppersoft principles">
      <div class="wrap values-grid">
        <article>
          <div><strong data-de="Präzise bauen." data-en="Build precisely."></strong><p data-de="Klare Wege, saubere Übergaben." data-en="Clear paths, clean handovers."></p></div>
        </article>
        <article>
          <div><strong data-de="Stabil betreiben." data-en="Run reliably."></strong><p data-de="Auch wenn es anspruchsvoll wird." data-en="Even when the route gets hard."></p></div>
        </article>
        <article>
          <div><strong data-de="Verantwortung tragen." data-en="Own the outcome."></strong><p data-de="Vom Start bis zum Ziel." data-en="From start to finish."></p></div>
        </article>
      </div>
    </section>
  </main>

  <script src="../main.js"></script>
  <script src="wire-loop.js"></script>
</body>
</html>
